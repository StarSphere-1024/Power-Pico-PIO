[platformio]
default_envs = power_pico
test_dir = tests

[stm32]
platform = ststm32
board = genericSTM32F411CE
framework = stm32cube
extra_scripts =
    pre:scripts/fpu-link.py
    pre:scripts/daplink-upload.py
upload_protocol = cmsis-dap
board_build.f_cpu = 100000000L
lib_deps =
    STM32_USB_Device_Library
build_flags =
    -mfpu=fpv4-sp-d16
    -mfloat-abi=hard
    -std=gnu11
    -DUSE_HAL_DRIVER
    -DSTM32F411xE

[env:bootloader]
extends = stm32
board_build.ldscript = src/bootloader/STM32F411XX_FLASH.ld
board_upload.maximum_size = 49152
board_upload.offset_address = 0x08000000
build_src_filter =
    +<bootloader/Core/Src/*.c>
    +<bootloader/BSP/**/*.c>
    +<bootloader/Ymodem/*.c>
    +<bootloader/SYSTEM/*.c>
    +<bootloader/USB_DEVICE/**/*.c>
build_flags =
    ${stm32.build_flags}
    -I$PROJECT_SRC_DIR/bootloader/Core/Inc
    -I$PROJECT_SRC_DIR/bootloader/USB_DEVICE/App
    -I$PROJECT_SRC_DIR/bootloader/USB_DEVICE/Target
    -I$PROJECT_SRC_DIR/bootloader/BSP
    -I$PROJECT_SRC_DIR/bootloader/BSP/EEPROM
    -I$PROJECT_SRC_DIR/bootloader/BSP/KEY
    -I$PROJECT_SRC_DIR/bootloader/BSP/LCD
    -I$PROJECT_SRC_DIR/bootloader/SYSTEM
    -I$PROJECT_SRC_DIR/bootloader/Ymodem

[env:power_pico]
extends = stm32
board_build.ldscript = src/app/STM32F411XX_FLASH.ld
board_upload.maximum_size = 458752
board_upload.offset_address = 0x08010000
lib_deps =
    ${stm32.lib_deps}
    LVGL
    FreeRTOS
build_src_filter =
    +<app/Core/Src/*.c>
    +<app/BSP/**/*.c>
    +<app/User/**/*.c>
    +<app/USB_DEVICE/**/*.c>
build_flags =
    ${stm32.build_flags}
    -Wl,-u,_printf_float
    -DMY_DISP_HOR_RES=240
    -DMY_DISP_VER_RES=240
    -DLV_CONF_INCLUDE_SIMPLE
    -I$PROJECT_SRC_DIR/app/Core/Inc
    -I$PROJECT_SRC_DIR/app/USB_DEVICE/App
    -I$PROJECT_SRC_DIR/app/USB_DEVICE/Target
    -I$PROJECT_SRC_DIR/app/BSP
    -I$PROJECT_SRC_DIR/app/BSP/BEEP
    -I$PROJECT_SRC_DIR/app/BSP/EEPROM
    -I$PROJECT_SRC_DIR/app/BSP/GATE
    -I$PROJECT_SRC_DIR/app/BSP/KEY
    -I$PROJECT_SRC_DIR/app/BSP/LCD
    -I$PROJECT_SRC_DIR/app/BSP/PD
    -I$PROJECT_SRC_DIR/app/User
    -I$PROJECT_SRC_DIR/app/User/Tasks/Inc
    -I$PROJECT_SRC_DIR/app/User/GUI
    -I$PROJECT_SRC_DIR/app/User/GUI/common
    -I$PROJECT_SRC_DIR/app/User/GUI/screens

[native]
platform = native
test_framework = unity
test_build_src = yes
build_flags =
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -lm

[env:native_fonts]
extends = native
test_filter = test_ui_fonts
extra_scripts = pre:scripts/native-fonts.py
lib_deps = LVGL
lib_ignore =
    FreeRTOS
    STM32_USB_Device_Library
build_src_filter =
    +<app/User/GUI/font/*.c>
    +<app/User/GUI/common/lv_i18n.c>
build_flags =
    ${native.build_flags}
    -std=gnu11
    -Os
    -DLV_CONF_INCLUDE_SIMPLE
    -I$PROJECT_SRC_DIR/app/User/GUI

[env:native_settings]
extends = native
test_filter = test_settings
lib_ignore =
    LVGL
    FreeRTOS
    STM32_USB_Device_Library
build_src_filter =
    +<app/BSP/EEPROM/BL24C02.c>
    +<app/User/user_AdcDataStrategy.c>
    +<app/User/user_CmdStrategy.c>
build_flags =
    ${native.build_flags}
    -std=c11
    -O1
    -g
    -Wall
    -Wextra
    -Werror
    -I$PROJECT_DIR/tests/support/settings
    -I$PROJECT_SRC_DIR/app/BSP/EEPROM
    -I$PROJECT_SRC_DIR/app/BSP/GATE
    -I$PROJECT_SRC_DIR/app/User
    -I$PROJECT_SRC_DIR/app/User/Tasks/Inc
