[platformio]
default_envs = bootloader, power_pico

[env]
platform = ststm32
board = genericSTM32F411CE
framework = stm32cube
extra_scripts = pre:scripts/fpu-link.py
board_build.f_cpu = 100000000L
build_flags =
    -mfpu=fpv4-sp-d16
    -mfloat-abi=hard
    -std=gnu11
    -DUSE_HAL_DRIVER
    -DSTM32F411xE

[env:bootloader]
board_build.ldscript = src/bootloader/STM32F411XX_FLASH.ld
board_upload.maximum_size = 49152
board_upload.offset_address = 0x08000000
build_src_filter =
    +<bootloader/Core/Src/*.c>
    +<bootloader/BSP/**/*.c>
    +<bootloader/Ymodem/*.c>
    +<bootloader/SYSTEM/*.c>
    +<bootloader/USB_DEVICE/**/*.c>
    +<bootloader/Middlewares/ST/STM32_USB_Device_Library/**/*.c>
build_flags =
    ${env.build_flags}
    -I$PROJECT_SRC_DIR/bootloader/Core/Inc
    -I$PROJECT_SRC_DIR/bootloader/USB_DEVICE/App
    -I$PROJECT_SRC_DIR/bootloader/USB_DEVICE/Target
    -I$PROJECT_SRC_DIR/bootloader/BSP
    -I$PROJECT_SRC_DIR/bootloader/BSP/EEPROM
    -I$PROJECT_SRC_DIR/bootloader/BSP/KEY
    -I$PROJECT_SRC_DIR/bootloader/BSP/LCD
    -I$PROJECT_SRC_DIR/bootloader/SYSTEM
    -I$PROJECT_SRC_DIR/bootloader/Ymodem
    -I$PROJECT_SRC_DIR/bootloader/Middlewares/ST/STM32_USB_Device_Library/Core/Inc
    -I$PROJECT_SRC_DIR/bootloader/Middlewares/ST/STM32_USB_Device_Library/Class/CDC/Inc

[env:power_pico]
board_build.ldscript = src/app/STM32F411XX_FLASH.ld
board_upload.maximum_size = 458752
board_upload.offset_address = 0x08010000
build_src_filter =
    +<app/Core/Src/*.c>
    +<app/BSP/**/*.c>
    +<app/User/**/*.c>
    +<app/USB_DEVICE/**/*.c>
    +<app/Middlewares/LVGL/src/**/*.c>
    -<app/Middlewares/LVGL/src/drivers/**>
    +<app/Middlewares/LVGL/porting/*.c>
    +<app/Middlewares/ST/STM32_USB_Device_Library/**/*.c>
    +<app/Middlewares/Third_Party/FreeRTOS/Source/*.c>
    +<app/Middlewares/Third_Party/FreeRTOS/Source/CMSIS_RTOS_V2/*.c>
    +<app/Middlewares/Third_Party/FreeRTOS/Source/portable/MemMang/heap_4.c>
    +<app/Middlewares/Third_Party/FreeRTOS/Source/portable/GCC/ARM_CM4F/*.c>
build_flags =
    ${env.build_flags}
    -DMY_DISP_HOR_RES=240
    -DMY_DISP_VER_RES=240
    -DLV_CONF_INCLUDE_SIMPLE
    -I$PROJECT_SRC_DIR/app/Core/Inc
    -I$PROJECT_SRC_DIR/app/USB_DEVICE/App
    -I$PROJECT_SRC_DIR/app/USB_DEVICE/Target
    -I$PROJECT_SRC_DIR/app/BSP
    -I$PROJECT_SRC_DIR/app/BSP/BEEP
    -I$PROJECT_SRC_DIR/app/BSP/EEPROM
    -I$PROJECT_SRC_DIR/app/BSP/GATE
    -I$PROJECT_SRC_DIR/app/BSP/KEY
    -I$PROJECT_SRC_DIR/app/BSP/LCD
    -I$PROJECT_SRC_DIR/app/BSP/PD
    -I$PROJECT_SRC_DIR/app/User
    -I$PROJECT_SRC_DIR/app/User/Tasks/Inc
    -I$PROJECT_SRC_DIR/app/User/GUI
    -I$PROJECT_SRC_DIR/app/User/GUI/common
    -I$PROJECT_SRC_DIR/app/User/GUI/screens
    -I$PROJECT_SRC_DIR/app/Middlewares/LVGL
    -I$PROJECT_SRC_DIR/app/Middlewares/LVGL/src
    -I$PROJECT_SRC_DIR/app/Middlewares/LVGL/porting
    -I$PROJECT_SRC_DIR/app/Middlewares/Third_Party/FreeRTOS/Source/include
    -I$PROJECT_SRC_DIR/app/Middlewares/Third_Party/FreeRTOS/Source/CMSIS_RTOS_V2
    -I$PROJECT_SRC_DIR/app/Middlewares/Third_Party/FreeRTOS/Source/portable/GCC/ARM_CM4F
    -I$PROJECT_SRC_DIR/app/Middlewares/ST/STM32_USB_Device_Library/Core/Inc
    -I$PROJECT_SRC_DIR/app/Middlewares/ST/STM32_USB_Device_Library/Class/CDC/Inc
